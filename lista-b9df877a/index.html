<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confirmări — botezul lui Eduard</title>
<style>
  :root{
    --paper:#f2eee3; --card:#fdfbf5; --ink:#232c26; --ink-soft:#5c6a5f;
    --green:#5d7460; --line:#e0d9c8; --line-soft:#ece6d8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    padding:clamp(14px,4vw,44px) 14px 60px
  }
  .panel{
    max-width:860px;margin:0 auto;background:var(--card);border:1px solid var(--line);
    border-radius:3px;padding:clamp(22px,5vw,38px)
  }
  h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(23px,5vw,31px);margin:0}
  .sub{margin:5px 0 0;color:var(--ink-soft);font-size:14px}

  .totals{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 22px}
  .tot{border:1px solid var(--line);border-radius:2px;padding:12px 17px;background:#fbf8f0;min-width:112px}
  .tot .n{font-family:Georgia,serif;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
  .tot .k{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--ink-soft);margin-top:5px}

  .wrap{overflow-x:auto;border-top:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line-soft)}
  th{
    text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--ink-soft);
    font-weight:400;white-space:nowrap
  }
  td.num{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;width:76px}
  td.when{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-soft);font-size:14px}
  tbody tr:nth-child(even){background:#fbf8f0}
  tfoot td{font-weight:600;color:var(--green);border-top:1px solid var(--line);border-bottom:0}
  .msg{padding:24px 0;color:var(--ink-soft);font-size:14.5px;margin:0}

  .foot{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line)
  }
  .stamp{font-size:12.5px;color:var(--ink-soft)}
  button{
    min-height:44px;padding:0 20px;background:var(--green);color:#fff;border:0;border-radius:2px;
    font-family:inherit;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer
  }
  button[disabled]{background:#c9cec6;cursor:default}
  button:not([disabled]):hover{background:#4f6552}
</style>
</head>
<body>
<div class="panel">
  <h1>Confirmări — botezul lui Eduard</h1>
  <p class="sub">24 octombrie 2026 · pagină privată, neindexată · se reîncarcă singură la fiecare minut</p>

  <div class="totals">
    <div class="tot"><div class="n" id="t-entries">—</div><div class="k">confirmări</div></div>
    <div class="tot"><div class="n" id="t-adults">—</div><div class="k">adulți</div></div>
    <div class="tot"><div class="n" id="t-kids">—</div><div class="k">copii</div></div>
    <div class="tot"><div class="n" id="t-persons">—</div><div class="k">total persoane</div></div>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>Nume</th><th>Adulți</th><th>Copii</th><th>Total</th><th>Data și ora confirmării</th></tr>
      </thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
  <p class="msg" id="msg">Se încarcă...</p>

  <div class="foot">
    <button id="csv" disabled>Descarcă pentru Excel</button>
    <span class="stamp" id="stamp"></span>
  </div>
</div>

<script>
(function(){
  var rowsEl = document.getElementById('rows');
  var footEl = document.getElementById('foot');
  var msgEl = document.getElementById('msg');
  var stampEl = document.getElementById('stamp');
  var csvBtn = document.getElementById('csv');
  var list = [];

  function fmt(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('ro-RO', {day:'2-digit', month:'2-digit', year:'numeric'}) +
           ', ' + d.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'});
  }
  function cell(tr, text, cls){
    var td = document.createElement('td');
    td.textContent = String(text);
    if (cls) td.className = cls;
    tr.appendChild(td);
    return td;
  }

  function render(data){
    list = (data.confirmari || []).slice().reverse();   /* cele mai noi primele */
    rowsEl.textContent = '';
    footEl.textContent = '';

    document.getElementById('t-entries').textContent = list.length;
    document.getElementById('t-adults').textContent = data.total_adulti || 0;
    document.getElementById('t-kids').textContent = data.total_copii || 0;
    document.getElementById('t-persons').textContent = data.total_persoane || 0;

    if (!list.length){
      msgEl.textContent = 'Nicio confirmare încă. Tabelul se completează singur, pe măsură ce invitații confirmă.';
      csvBtn.disabled = true;
      return;
    }
    msgEl.textContent = '';
    csvBtn.disabled = false;

    list.forEach(function(e){
      var tr = document.createElement('tr');
      cell(tr, e.nume || '—');
      cell(tr, e.adulti, 'num');
      cell(tr, e.copii, 'num');
      cell(tr, e.total, 'num');
      cell(tr, fmt(e.trimis), 'when');
      rowsEl.appendChild(tr);
    });

    var tr = document.createElement('tr');
    cell(tr, 'TOTAL');
    cell(tr, data.total_adulti || 0, 'num');
    cell(tr, data.total_copii || 0, 'num');
    cell(tr, data.total_persoane || 0, 'num');
    cell(tr, '');
    footEl.appendChild(tr);
  }

  function load(){
    fetch('../data.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        render(data);
        stampEl.textContent = data.actualizat
          ? 'ultima preluare a confirmărilor: ' + fmt(data.actualizat)
          : '';
      })
      .catch(function(err){
        msgEl.textContent = 'Nu am putut citi lista (' + err.message + '). Se reîncearcă automat.';
      });
  }

  csvBtn.addEventListener('click', function(){
    if (!list.length) return;
    var esc = function(v){
      var s = String(v == null ? '' : v);
      return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var lines = ['Nume,Adulți,Copii,Total,Data și ora'];
    list.forEach(function(e){
      lines.push([e.nume, e.adulti, e.copii, e.total, fmt(e.trimis)].map(esc).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Confirmari-botez-Eduard-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  });

  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
