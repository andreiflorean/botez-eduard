name: Sincronizare confirmări

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-confirmari
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preia confirmările
        run: python3 scripts/sync.py

      - name: Salvează dacă s-a schimbat ceva
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "confirmari-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Confirmări actualizate"
            git push
          else
            echo "nimic nou"
          fi
